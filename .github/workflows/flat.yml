name: Refresh boundaries

on:
  push:
    branches:
      - main
    paths:
      - postprocess.py
      - requirements.txt
      - requirements.in
      - tests/**
      - .github/workflows/flat.yml
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '6 12 * * *'

permissions:
  contents: read

concurrency:
  group: boundaries-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  refresh:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Refresh and validate boundaries
        id: refresh
        continue-on-error: true
        run: python postprocess.py --fetch-catalogue --repair-invalid-geometry
      - name: Commit validated outputs and refresh status
        run: |
          git add -- geoportal.json outputs
          if [ -f refresh-manifest.json ]; then
            git add -- refresh-manifest.json
          fi
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Refresh boundary datasets" \
              -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
            git push
          fi
      - name: Report refresh failures
        if: steps.refresh.outcome == 'failure'
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("refresh-manifest.json")
          lines = ["## Boundary refresh failed", ""]
          if path.exists():
              manifest = json.loads(path.read_text())
              for section in ("services", "datasets"):
                  for name, record in manifest.get(section, {}).items():
                      if record.get("status") == "failed" and record.get("error"):
                          lines.append(f"- {name}: {record['error']}")
          lines.extend(["", "See **Refresh and validate boundaries** for full diagnostics.",
                        "Failed datasets retain their previous outputs."])
          summary = "\n".join(lines) + "\n"
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as handle:
              handle.write(summary)
          PY
          exit 1
